<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 300px;
            text-align: center;
            background-color: white;
            
        }

        tr > td {
            padding: 8px;
            border: 2px solid black;
            background-color: lightgray;

        }

        td:hover {
            background-color: lightblue;
            transform: scale(1.2);
        }

        

    </style>

    <title>Teclado com tabelas</title>
</head>
<body>
    <table>
        <tr>
            <td style="background-color: darkgray;">ESC</td>
            <td style="border: none; background-color: white;"></td>
            <td>F1</td>
            <td>F2</td>
            <td>F3</td>
            <td>F4</td>
            <td style="background-color: darkgray;">F5</td>
            <td style="background-color: darkgray;">F6</td>
            <td style="background-color: darkgray;">F7</td>
            <td style="background-color: darkgray;">F8</td>
            <td>F9</td>
            <td>F10</td>
            <td>F11</td>
            <td>F12</td>
        </tr> 
        
        <tr>
            <td>' ~</td>
            <td>1</td>
            <td>2</td>
            <td>3</td>
            <td>4</td>
            <td>5</td>
            <td>6</td>
            <td>7</td>
            <td>8</td>
            <td>9</td>
            <td>0</td>
            <td>-_</td>
            <td>= +</td>
            <td><-</td>
            <td style="background-color: darkgray;">PrtSc</td>
            <td style="background-color: darkgray;">ScrLK</td>
            <td style="background-color: darkgray;">Pause</td>
        </tr>

        <tr>
            <td style="background-color: darkgray;">Tab</td>
            <td>Q</td>
            <td>W</td>
            <td>E</td>
            <td>R</td>
            <td>T</td>
            <td>Y</td>
            <td>U</td>
            <td>I</td>
            <td>O</td>
            <td>P</td>
            <td>[{</td>
            <td>]}</td>
            <td style="background-color: darkgray;">\:</td>
            <td style="background-color: darkgray;">Ins</td>
            <td style="background-color: darkgray;">Home</td>
            <td style="background-color: darkgray;">PyUp</td>
        </tr>

        <tr>
            <td style="background-color: darkgray;">Caps</td>
            <td>A</td>
            <td>S</td>
            <td>D</td>
            <td>F</td>
            <td>G</td>
            <td>H</td>
            <td>J</td>
            <td>K</td>
            <td>L</td>
            <td>;:</td>
            <td>` "</td>
            <td colspan="2">Enter</td>
            <td style="background-color: darkgray;">Del</td>
            <td style="background-color: darkgray;">End</td>
            <td style="background-color: darkgray;">PyDn</td>
            
        </tr>   

        <tr>
            <td colspan="2" style="background-color: darkgray;">Shift</td>
            <td>Z</td>
            <td>X</td>
            <td>C</td>
            <td>V</td>
            <td>B</td>
            <td>N</td>
            <td>M</td>
            <td>, < </td>
            <td>. ></td>
            <td>/?</td>
            <td colspan="2">Shift</td>
            
            <td style="border: none; background-color: white;"></td>
            <td></td>
        </tr>

        <tr>
            <td style="background-color: darkgray;">Ctrl</td>
            <td style="background-color: darkgray;">Win</td>
            <td style="background-color: darkgray;">Alt</td>
            <td colspan="7">-----</td>
            <td style="background-color: darkgray;">Alt</td>
            <td style="background-color: darkgray;">Fn</td>
            <td style="background-color: darkgray;"></td>
            <td style="background-color: darkgray;">Ctrl</td>
            <td></td>
            <td></td>
            <td></td>
        </tr>

    </table>
</body>
</html>
