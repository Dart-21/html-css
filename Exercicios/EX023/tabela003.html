<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0">

    <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            text-align: center;
        }

        td {
            border: 2px solid black;
            padding: 8px;
    
        }

    </style>

    <title>Tabelas</title>
</head>
<body>
    <h1>Mesclagem de células</h1>

    <table>
        <tr>
            <td>A</td>
            <td colspan="2">B</td>
            
        </tr>

        <tr>
             <td rowspan="3">D</td>
             <td>E</td>
             <td>F</td>
        </tr>

        <tr>
        
             <td>H</td>
             <td>I</td>
        </tr>

        <tr>
             
             <td>K</td>
             <td>L</td>
        </tr>
    </table>
</body>
</html>
