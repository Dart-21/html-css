<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <style>
        body {
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 400px;
            text-align: center;
        }

        td, th {
            border: 2px solid black;
            padding: 8px;
    
        }

        th {
            font-weight: bold;
        }

        .destaque {
            background-color: skyblue;
        }

        col.cnome {
            background-color: skyblue;
        }

        col.csexo {
            background-color: violet;
        }

    </style>

    <title>Exercicio de tabelas</title>
</head>
<body>
    <h1>Exercicio de tabela</h1>

    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>

        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>

        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>

        <tr>
            <td>Claudio</td>
            <td>M</td> 
            <td>28</td>
            <td>Programador</td>
        </tr>

        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>42</td>
            <td>Professor</td>
        </tr>

        <tr>
            <td>Héllio</td>
            <td>M</td> 
            <td>19</td>
            <td>Vendedor</td>
        </tr>

        <tr>
            <td>Maria</td>
            <td>F</td> 
            <td>39</td> 
            <td>Médica</td>
        </tr>

        <tr>
            <td>Otávio</td>
            <td>M</td> 
            <td>22</td> 
            <td>Nutricionista</td>
        </tr>
        
    </table>
</body>
</html>
